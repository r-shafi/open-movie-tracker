<ion-tabs (ionTabsDidChange)="onTabChange()">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="discover">
      <ion-icon name="compass-outline"></ion-icon>
      <ion-label>Discover</ion-label>
    </ion-tab-button>

    <ion-tab-button
      class="quick-log-tab-button"
      (click)="openQuickLog($event)"
      [attr.aria-label]="'Quick log film or TV show'"
      aria-label="Quick log film or TV show"
    >
      <div class="quick-log-circle">
        <ion-icon name="add"></ion-icon>
      </div>
      <span class="sr-only">Quick log film or TV show</span>
    </ion-tab-button>

    <ion-tab-button tab="search">
      <ion-icon name="search-outline"></ion-icon>
      <ion-label>Search</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
